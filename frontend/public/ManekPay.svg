<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Rethink+Sans:ital,wght@0,400..800;1,400..800&amp;display=swap');
      .bg { fill: #0B132B; }
      .brand-manek {
        font-family: 'Rethink Sans', sans-serif;
        font-weight: 800;
        font-size: 76px;
        fill: #FFFFFF;
        letter-spacing: -0.03em;
      }
      .brand-pay {
        font-family: 'Rethink Sans', sans-serif;
        font-weight: 800;
        font-size: 76px;
        fill: #00E5FF; /* Vibrant Cyan */
        letter-spacing: -0.03em;
      }
    </style>
  </defs>

  <!-- Deep Navy Background -->
  <rect class="bg" width="800" height="350" rx="20" />

  <!-- Logo Text -->
  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle">
    <tspan class="brand-manek">Manek</tspan><tspan class="brand-pay">Pay</tspan>
  </text>
</svg>
