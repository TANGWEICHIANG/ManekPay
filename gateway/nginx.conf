events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://host.docker.internal:5173;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /api/ledger/ {
            proxy_pass http://host.docker.internal:8081/;
        }

        location /api/fx/ {
            proxy_pass http://host.docker.internal:8082/;
        }

        location /api/vaults/ {
            proxy_pass http://host.docker.internal:8083/;
        }

        location /api/risk/ {
            proxy_pass http://host.docker.internal:8084/;
        }

        location /api/wealth/ {
            proxy_pass http://host.docker.internal:8085/;
        }

        location /api/auth/ {
            proxy_pass http://host.docker.internal:8086/;
        }

        location /api/inquiries {
            proxy_pass http://host.docker.internal:8086/inquiries;
        }
    }
}
