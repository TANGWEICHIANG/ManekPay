server:
  port: 8086

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/manekpay
    username: manekpay
    password: manekpay
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    baseline-on-migrate: true
    table: flyway_schema_history_auth
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # DEV KEYPAIR ONLY — a fixed, checked-in RSA key pair for local development and CI.
    # Never deploy this to a real environment; override JWT_PRIVATE_KEY / JWT_PUBLIC_KEY
    # from a secrets manager before this service is exposed anywhere real.
    private-key: "${JWT_PRIVATE_KEY:}"
    public-key: "${JWT_PUBLIC_KEY:}"
