server:
  port: 8083

spring:
  application:
    name: vaults-service
  datasource:
    url: jdbc:postgresql://localhost:5432/manekpay
    username: manekpay
    password: manekpay
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_vaults
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL:http://localhost:8086}/.well-known/jwks.json
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: vaults-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.manekpay.vaults.dto
        spring.json.value.default.type: com.manekpay.vaults.dto.TransactionCreatedEvent
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  auth-service:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8086}
  ledger-service:
    base-url: ${LEDGER_SERVICE_URL:http://localhost:8081}
  service-credentials:
    # Must match auth-service's app.service-credentials.vaults-service-secret exactly. DEV-ONLY
    # default - override VAULTS_SERVICE_CLIENT_SECRET from a secrets manager before deploying.
    client-secret: "${VAULTS_SERVICE_CLIENT_SECRET:dev-only-vaults-service-secret-change-me}"

management:
  endpoints:
    web:
      exposure:
        include: health
