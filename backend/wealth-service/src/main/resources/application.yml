server:
  port: 8085

spring:
  application:
    name: wealth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/manekpay
    username: manekpay
    password: manekpay
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_wealth
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL:http://localhost:8086}/.well-known/jwks.json

management:
  endpoints:
    web:
      exposure:
        include: health
